# Single source of truth for versions. Libraries whose version is managed by
# the Spring Boot or Spring Modulith BOM are declared in the build scripts
# without a version; only the BOMs and unmanaged libraries are pinned here.

[versions]
java = "25"
spring-boot = "4.1.1"
spring-modulith = "2.1.1"
springdoc = "3.1.1"

# The database vendor. Switching vendors changes this image, the database-*
# libraries below, the container type in :shared's DatabaseTestcontainers and
# the other places listed under "Database vendor" in docs/architecture.md.
#
# A full image name (a mirror's is fine), not a version: blueprint.java-conventions
# passes it to the tests as a system property. Never use it as a `version.ref`.
database-image = "postgres:18-alpine"

[libraries]
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "spring-modulith" }
springdoc-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

# Database vendor libraries; the Spring Boot BOM manages their versions.
database-jdbc-driver = { module = "org.postgresql:postgresql" }
database-flyway = { module = "org.flywaydb:flyway-database-postgresql" }
database-testcontainers = { module = "org.testcontainers:testcontainers-postgresql" }

[bundles]
# The cache provider's libraries; empty when the cache is off or in memory
# without one (see spring.cache in the platform defaults).
cache = []
