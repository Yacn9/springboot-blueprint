name: Build

# Every push: compile, then unit, module, architecture and end-to-end tests
# against real containers (GitHub's runners have Docker) — and, where the
# project has them, the container image and the Helm chart.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Build the image
        if: hashFiles('Dockerfile') != ''
        run: docker build --tag app .

      - name: Check the Helm chart
        if: hashFiles('deploy/helm/*/Chart.yaml') != ''
        run: |
          helm lint deploy/helm/*
          helm template deploy/helm/* > /dev/null
