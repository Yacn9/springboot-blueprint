{{- if not .Values.datasource.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-datasource
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  username: {{ .Values.datasource.username | quote }}
  password: {{ .Values.datasource.password | quote }}
{{- end }}
