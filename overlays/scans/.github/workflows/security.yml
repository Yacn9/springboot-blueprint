name: Security scans

# OWASP-style checks, on every pull request, every push to main and weekly:
#   CodeQL           static analysis of the code (SAST)
#   Dependency-Check known vulnerabilities in the libraries (SCA)
#   ZAP baseline     the running application, probed from outside (DAST)
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
      - run: ./gradlew compileJava compileTestJava --console=plain
      - uses: github/codeql-action/analyze@v4

  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Check the dependencies (fails at CVSS 7 or above)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::warning::Add an NVD_API_KEY repository secret to run Dependency-Check."
            exit 0
          fi
          ./gradlew dependencyCheckAggregate --console=plain
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: dependency-check-report
          path: build/reports/dependency-check-report.*
          if-no-files-found: ignore

  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Start the application (compose.yaml provides its database)
        id: app
        run: |
          if [ ! -f compose.yaml ]; then
            echo "::warning::The ZAP scan needs compose.yaml to start the application's database."
            echo "running=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          nohup ./gradlew :app:bootRun --console=plain > app.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --silent --fail localhost:8080/actuator/health > /dev/null; then
              echo "running=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          tail -80 app.log
          exit 1
      - uses: zaproxy/action-baseline@v0.15.0
        if: steps.app.outputs.running == 'true'
        with:
          target: http://localhost:8080
          allow_issue_writing: false
