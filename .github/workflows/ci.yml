name: Build generated projects

# Generates a project for each database the CLI offers and runs its full build —
# unit, module, architecture and end-to-end tests against a real database
# container. The PostgreSQL project is the template itself, renamed; the Oracle
# one is the only place the Oracle overlay is ever built.
on:
  push:
  pull_request:

jobs:
  generated-project:
    strategy:
      fail-fast: false
      matrix:
        # Each database once without a cache, each cache server on PostgreSQL, and a
        # project that starts without the sample modules.
        include:
          - { database: postgresql, cache: none }
          - { database: oracle, cache: none }
          - { database: postgresql, cache: memory }
          - { database: postgresql, cache: redis }
          - { database: postgresql, cache: memcached }
          - { database: oracle, cache: redis, flags: --no-samples }
          - { database: postgresql, cache: redis, flags: --broker kafka --deploy kubernetes --ci --security --observability --dependabot }
          - { database: postgresql, cache: none, flags: --broker redpanda --deploy docker }
          - { database: oracle, cache: memcached, flags: --deploy docker --security }
          - { database: postgresql, cache: none, flags: --deploy docker --no-compose }
    runs-on: ubuntu-latest
    defaults:
      run:
        # Named explicitly, GitHub runs bash with pipefail: `./gradlew build | tee` fails when the build does.
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Generate a ${{ matrix.database }} project, cache ${{ matrix.cache }}
        env:
          BLUEPRINT_OFFLINE: "1"   # the template's own versions, not whatever was released today
        run: |
          chmod +x gradlew
          ./gradlew -p cli jar --console=plain
          java -jar cli/build/libs/blueprint-cli-*.jar new ci-app --database ${{ matrix.database }} --cache ${{ matrix.cache }} --no-git ${{ matrix.flags }} \
            --parent-dir "$RUNNER_TEMP" </dev/null

      - name: Build it
        working-directory: ${{ runner.temp }}/ci-app
        run: ./gradlew build --console=plain 2>&1 | tee build.log

      # hashFiles() sees only the workspace, so these steps check for their files themselves.
      - name: Build the image
        working-directory: ${{ runner.temp }}/ci-app
        run: |
          [ -f Dockerfile ] || { echo "no Dockerfile"; exit 0; }
          docker build --tag ci-app . 2>&1 | tee -a build.log

      - name: Check the Helm chart
        working-directory: ${{ runner.temp }}/ci-app
        run: |
          [ -d deploy/helm ] || { echo "no Helm chart"; exit 0; }
          helm lint deploy/helm/* 2>&1 | tee -a build.log
          helm template deploy/helm/* > /dev/null

      # The image against its compose database (and cache): it must report healthy.
      - name: Run the full stack
        working-directory: ${{ runner.temp }}/ci-app
        run: |
          [ -f Dockerfile ] && [ -f compose.yaml ] || { echo "no Dockerfile and compose.yaml"; exit 0; }
          docker compose --profile app up --detach --build
          for attempt in $(seq 1 60); do
            if curl --silent --fail localhost:8080/actuator/health | grep -q '"status":"UP"'; then echo healthy; exit 0; fi
            sleep 5
          done
          docker compose --profile app logs app | tail -60 | tee -a build.log
          echo "What went wrong:" >> build.log; echo "the application never reported healthy" >> build.log
          exit 1

      # Annotations are public, unlike logs: anyone can see why a build failed.
      - name: Report why
        if: failure()
        working-directory: ${{ runner.temp }}/ci-app
        run: |
          python3 - <<'PY'
          import glob, re, xml.etree.ElementTree as ET
          for path in glob.glob("**/build/test-results/test/*.xml", recursive=True):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for problem in [*case.iter("failure"), *case.iter("error")]:
                      text = problem.text or problem.get("message", "")
                      causes = re.findall(r"Caused by: (.*)", text)
                      message = (causes[-1] if causes else text.strip().splitlines()[0])[:1500]
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{message}")
          try:
              log = open("build.log", encoding="utf-8").read()
              for went_wrong in re.findall(r"What went wrong:\n(.*(?:\n.+){0,6})", log):
                  print("::error title=Gradle::" + went_wrong.replace("\n", " | ")[:1500])
          except FileNotFoundError:
              pass
          PY

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports-${{ matrix.database }}-${{ matrix.cache }}
          path: ${{ runner.temp }}/ci-app/**/build/reports/tests/
